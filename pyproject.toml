[project]
name = "rivals"
version = "0.1.0"
description = "从《命令与征服：宿敌》客户端提取单位数值并输出 JSON"
readme = "README.md"
authors = [
    { name = "WolfGenerals", email = "2301146268@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lupa>=2.8",
]

[project.scripts]
rivals = "rivals:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
